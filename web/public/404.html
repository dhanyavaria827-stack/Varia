<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gurukulam</title>
    <script>
      // Single Page Apps for GitHub Pages: redirects a deep-link 404
      // (e.g. /Varia/admissions) into a query string index.html can restore
      // client-side. https://github.com/rafgraph/spa-github-pages
      var segmentCount = 1; // path segments that make up the GitHub Pages base ("/Varia")
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname.split("/").slice(0, 1 + segmentCount).join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
